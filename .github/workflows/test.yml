name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No install step on purpose: this project has no dependencies.
      - name: Engine unit tests
        run: python engine/tests/test_memory.py

      - name: Recall gate
        run: python engine/tests/golden_recall.py

      # A gate that has only ever passed is not evidence. These two steps break
      # things on purpose and fail if the checks do not notice.
      - name: Recall gate mutation
        run: python engine/tests/golden_recall.py --mutate

      - name: Method gates, including mutation
        run: python method/gates/tests/test_gates.py
